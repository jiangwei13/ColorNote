import com.github.megatronking.stringfog.plugin.StringFogMode
import com.p.b.CustomKeyGenerator


plugins {
    alias(libs.plugins.android.application)
    id 'org.jetbrains.kotlin.android'
    id("walle")
}


apply plugin: 'top.niunaijun.blackobfuscator'
apply plugin: 'xml-class-guard'
apply plugin: 'android-junk-code'
apply plugin: 'stringfog'

apply from: "../../third-module/build_tools/jiagu/jiagu.gradle"


xmlClassGuard {
    mappingFile = file("xml-class-mapping.txt")
}


// 加入dex混淆配置
BlackObfuscator {
    // 仅 release 构建时启用
    enabled gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
    // 混淆深度
    depth 2
    // xmlClassGuard/packageChange 产出的映射，供本地插件回填原始/变更后的包名前缀
    mappingFile = file("xml-class-mapping.txt")
    // Kotlin object/companion 的静态初始化对 verifier 很敏感，dex 级变换默认跳过这些结构
    skipStaticInitializer true
    skipKotlinSynthetic true
    skipKotlinSingletonLikeClasses true
    skipInnerClasses true
    skipAndroidComponents false
    skipCallbackLikeClasses true
    // 这里只是候选包前缀，最终是否进入 dex 控制流混淆还会经过 Kotlin 安全过滤
    obfClass = []

    // blackClass中的包或者类不会进行混淆(匹配前面一段)
    blackClass = ["top.niunaijun.black"]
}


androidJunkCode {
    variantConfig {
        release {
            packageBase = "com.colornote.junk"
            packageCount = 50
            activityCountPerPackage = 40
            excludeActivityJavaFile = false
            otherCountPerPackage = 50
            methodCountPerClass = 20
            resPrefix = "cn_"
            drawableCount = 100
            stringCount = 100
        }
    }
}


stringfog {
    enable true
    debug false
    // 指定加解密的具体实现类，buildSrc中和app中均要包含此实现源文件
    implementation 'com.stringfog.impl.CustomStringFogImpl'
    // 指定需加密的代码包路径，可配置多个，未指定将默认全部加密
//    fogPackages = ["com.austa.colornote"]
    // 4.0版本新增：使用自定义密钥生成器
    kg new CustomKeyGenerator()
//    kg new RandomKeyGenerator()
    // 可选（4.0版本新增）：用于控制字符串加密后在字节码中的存在形式, 默认为base64，
    // 也可以使用text或者bytes
    mode StringFogMode.base64
}

android {
    namespace 'com.austa.colornote'
    compileSdk 35

    defaultConfig {
        applicationId "com.austa.colornote1"
        minSdk 24
        targetSdk 36
        versionCode rootProject.ext.appConfig.VERSIONCODE
        versionName rootProject.ext.appConfig.VERSIONNAME

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            keyAlias 'key0'
            keyPassword 'austa1212'
            storeFile file('JKSFILE')
            storePassword 'austa1212'
        }
        debug {
            keyAlias 'key0'
            keyPassword 'austa1212'
            storeFile file('JKSFILE')
            storePassword 'austa1212'
        }
    }


    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures{
        buildConfig = true
        viewBinding = true
    }



}

